name: Platform conformance

on:
  pull_request:
    paths:
      - README.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - PLATFORM-RELEASES.md
      - repositories.public.json
      - contracts/**
      - schemas/**
      - releases/**
      - tests/fixtures/**
      - requirements-platform-contract.txt
      - scripts/validate_platform_contract.py
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_release.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - PLATFORM-RELEASES.md
      - repositories.public.json
      - contracts/**
      - schemas/**
      - releases/**
      - tests/fixtures/**
      - requirements-platform-contract.txt
      - scripts/validate_platform_contract.py
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_release.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project-wide baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install platform contract validator dependencies
        run: python3 -m pip install --requirement requirements-platform-contract.txt
      - name: Validate machine-readable Development contract
        run: >-
          python3 scripts/validate_platform_contract.py
          tests/fixtures/goreecloud.platform.development.yaml
          --expected-repository GoreeCloud/GoreeCloud
          --output conformance-result.json
      - name: Prove Stable fails closed without mandatory evidence
        shell: bash
        run: |
          cp tests/fixtures/goreecloud.platform.development.yaml /tmp/goreecloud.platform.stable.yaml
          sed -i 's/lifecycle: Development/lifecycle: Stable/' /tmp/goreecloud.platform.stable.yaml
          if python3 scripts/validate_platform_contract.py /tmp/goreecloud.platform.stable.yaml --expected-repository GoreeCloud/GoreeCloud; then
            echo 'Stable non-conformance was incorrectly accepted' >&2
            exit 1
          fi
      - name: Validate repository-local platform conformance
        run: python3 scripts/validate_platform_conformance.py
      - name: Validate privacy-bounded public repository registry
        run: python3 scripts/validate_public_repository_registry.py
      - name: Validate blocked GoreeCloud 2026.10 planning manifest
        run: >-
          python3 scripts/validate_platform_release.py
          releases/goreecloud-2026.10.candidate.yaml
          --output platform-release-validation.json
      - name: Prove release certification fails closed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          source = Path('releases/goreecloud-2026.10.candidate.yaml')
          target = Path('/tmp/goreecloud-2026.10.false-certified.yaml')
          manifest = yaml.safe_load(source.read_text(encoding='utf-8'))
          manifest['release']['state'] = 'certified'
          manifest['release']['certified_at'] = '2026-09-03T01:30:00Z'
          manifest['compatibility']['matrix_state'] = 'verified'
          manifest['certification']['declared_result'] = 'certified'
          manifest['certification']['compatible'] = True
          manifest['certification']['blockers'] = []
          target.write_text(yaml.safe_dump(manifest, sort_keys=False), encoding='utf-8')
          PY
          if python3 scripts/validate_platform_release.py /tmp/goreecloud-2026.10.false-certified.yaml; then
            echo 'Incomplete platform release was incorrectly accepted as certified' >&2
            exit 1
          fi
