name: Platform conformance

on:
  pull_request:
    paths:
      - README.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - repositories.public.json
      - examples/goreecloud.platform.example.yaml
      - examples/goreecloud.platform.shared-library.example.yaml
      - examples/goreecloud.platform.shared-library.example.yaml
      - schemas/goreecloud.platform.schema.json
      - schemas/goreecloud.conformance-result.schema.json
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_manifest.py
      - scripts/evaluate_platform_conformance.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
      - .github/workflows/reusable-platform-manifest.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - repositories.public.json
      - examples/goreecloud.platform.example.yaml
      - schemas/goreecloud.platform.schema.json
      - schemas/goreecloud.conformance-result.schema.json
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_manifest.py
      - scripts/evaluate_platform_conformance.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
      - .github/workflows/reusable-platform-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project-wide baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"

      - name: Install platform contract dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate repository-local platform conformance
        run: python3 scripts/validate_platform_conformance.py

      - name: Validate Platform Contract schema syntax
        run: |
          python3 -m json.tool schemas/goreecloud.platform.schema.json >/dev/null
          python3 -m json.tool schemas/goreecloud.conformance-result.schema.json >/dev/null

      - name: Validate Platform Contract example manifests
        run: |
          python3 scripts/validate_platform_manifest.py examples/goreecloud.platform.example.yaml
          python3 scripts/validate_platform_manifest.py examples/goreecloud.platform.shared-library.example.yaml

      - name: Validate Contract 2.0 lifecycle fail-closed semantics
        run: |
          python3 - <<'PY'
          import copy
          import importlib.util
          from pathlib import Path
          import tempfile

          import yaml

          module_path = Path("scripts/validate_platform_manifest.py")
          spec = importlib.util.spec_from_file_location("platform_validator_lifecycle", module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          base = yaml.safe_load(Path("examples/goreecloud.platform.example.yaml").read_text())

          def validate_payload(payload):
              with tempfile.NamedTemporaryFile("w", suffix=".yaml", delete=False) as handle:
                  yaml.safe_dump(payload, handle, sort_keys=False)
                  path = Path(handle.name)
              try:
                  return module.validate_manifest(path)
              finally:
                  path.unlink(missing_ok=True)

          def expect_failure(payload, label):
              try:
                  validate_payload(payload)
              except module.ValidationError:
                  return
              raise SystemExit(f"{label} unexpectedly passed Contract 2.0 validation")

          legacy = copy.deepcopy(base)
          legacy["lifecycle"] = "development"
          expect_failure(legacy, "legacy development lifecycle")

          seal_missing_identity = copy.deepcopy(base)
          seal_missing_identity["lifecycle"] = "seal"
          seal_missing_identity["lifecycle_metadata"]["next_gate"] = "anchor"
          seal_missing_identity["lifecycle_metadata"]["candidate_identity"] = None
          expect_failure(seal_missing_identity, "Seal without exact candidate identity")

          seal = copy.deepcopy(base)
          seal["lifecycle"] = "seal"
          seal["lifecycle_metadata"]["next_gate"] = "anchor"
          seal["lifecycle_metadata"]["qualification_state"] = "in-progress"
          seal["lifecycle_metadata"]["candidate_identity"] = {
              "source_revision": "0" * 40,
          }
          validate_payload(seal)

          anchor_without_qualification = copy.deepcopy(base)
          anchor_without_qualification["lifecycle"] = "anchor"
          anchor_without_qualification["lifecycle_metadata"]["next_gate"] = "sunset"
          anchor_without_qualification["lifecycle_metadata"]["qualification_state"] = "in-progress"
          anchor_without_qualification["lifecycle_metadata"]["evidence"] = []
          expect_failure(anchor_without_qualification, "Anchor without passed qualification")

          print("platform-contract: lifecycle fail-closed semantics validated")
          PY

      - name: Validate shared-library Anchor acceptance profile
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/validate_platform_manifest.py")
          spec = importlib.util.spec_from_file_location("platform_validator", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          shared = module.anchor_acceptance_categories({"component": {"type": "shared-library"}})
          expected = {
              "accessibility",
              "supported-platform",
              "security",
              "privacy",
              "documentation",
              "integration",
              "release",
          }
          if shared != expected:
              raise SystemExit(f"unexpected shared-library Anchor profile: {sorted(shared)}")

          application = module.anchor_acceptance_categories({"component": {"type": "application"}})
          if application != module.ANCHOR_ACCEPTANCE_CATEGORIES:
              raise SystemExit("application Anchor profile changed unexpectedly")
          expected_lifecycle = ("seed", "lab", "forge", "weave", "seal", "anchor", "sunset", "archive")
          if tuple(module.LIFECYCLE_STAGES) != expected_lifecycle:
              raise SystemExit(f"unexpected Contract 2.0 lifecycle vocabulary: {module.LIFECYCLE_STAGES!r}")
          if module.SCHEMA_VERSION != "2.0":
              raise SystemExit(f"unexpected Platform Contract schema version: {module.SCHEMA_VERSION!r}")
          print("platform-contract: shared-library Anchor profile and lifecycle vocabulary validated")
          PY

      - name: Compute example conformance result
        run: |
          python3 scripts/evaluate_platform_conformance.py \
            examples/goreecloud.platform.example.yaml \
            --revision "$CANDIDATE_REVISION" \
            --evaluator-revision "$CANDIDATE_REVISION" \
            --evaluated-at 2026-09-03T00:00:00Z \
            --output /tmp/goreecloud.conformance-result.json

      - name: Validate example conformance result schema and provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('schemas/goreecloud.conformance-result.schema.json').read_text())
          result = json.loads(Path('/tmp/goreecloud.conformance-result.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(result)
          expected_revision = os.environ['CANDIDATE_REVISION']
          if result['evaluated_revision'] != expected_revision:
              raise SystemExit('self-test evaluated revision must match the exact central candidate')
          if result['evaluator_revision'] != expected_revision:
              raise SystemExit('self-test evaluator revision must match the exact central candidate')
          if 'anchor_eligible' not in result or 'stable_eligible' in result:
              raise SystemExit('Contract 2.0 result must expose anchor_eligible and must not expose stable_eligible')
          print('platform-conformance-result: example provenance, lifecycle, and schema validated')
          PY

      - name: Validate privacy-bounded public repository registry
        run: python3 scripts/validate_public_repository_registry.py

  reusable-provenance:
    name: Exercise reusable exact-revision provenance
    uses: ./.github/workflows/reusable-platform-manifest.yml
    with:
      manifest-path: examples/goreecloud.platform.example.yaml
