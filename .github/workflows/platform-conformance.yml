name: Platform conformance

on:
  pull_request:
    paths:
      - README.md
      - REPOSITORIES.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - repositories.public.json
      - suite-products.snapshot.json
      - examples/goreecloud.platform.example.yaml
      - schemas/goreecloud.platform.schema.json
      - schemas/goreecloud.conformance-result.schema.json
      - scripts/audit_public_repository_baselines.py
      - scripts/audit_public_platform_manifests.py
      - scripts/audit_public_integral_platform_systems.py
      - scripts/audit_suite_product_coverage.py
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_manifest.py
      - scripts/evaluate_platform_conformance.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
      - .github/workflows/reusable-platform-manifest.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - REPOSITORIES.md
      - NATIVE-APPLICATION-AND-PLATFORM-CONFORMANCE.md
      - PLATFORM-CONTRACT.md
      - repositories.public.json
      - suite-products.snapshot.json
      - examples/goreecloud.platform.example.yaml
      - schemas/goreecloud.platform.schema.json
      - schemas/goreecloud.conformance-result.schema.json
      - scripts/audit_public_repository_baselines.py
      - scripts/audit_public_platform_manifests.py
      - scripts/audit_public_integral_platform_systems.py
      - scripts/audit_suite_product_coverage.py
      - scripts/validate_platform_conformance.py
      - scripts/validate_platform_manifest.py
      - scripts/evaluate_platform_conformance.py
      - scripts/validate_public_repository_registry.py
      - .github/workflows/platform-conformance.yml
      - .github/workflows/reusable-platform-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project-wide baselines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false

      - name: Verify exact candidate revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"

      - name: Install platform contract dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate repository-local platform conformance
        run: python3 scripts/validate_platform_conformance.py

      - name: Validate Platform Contract schema syntax
        run: |
          python3 -m json.tool schemas/goreecloud.platform.schema.json >/dev/null
          python3 -m json.tool schemas/goreecloud.conformance-result.schema.json >/dev/null

      - name: Validate Platform Contract example manifest
        run: python3 scripts/validate_platform_manifest.py examples/goreecloud.platform.example.yaml

      - name: Compute example conformance result
        run: |
          python3 scripts/evaluate_platform_conformance.py \
            examples/goreecloud.platform.example.yaml \
            --revision "$CANDIDATE_REVISION" \
            --evaluator-revision "$CANDIDATE_REVISION" \
            --evaluated-at 2026-09-03T00:00:00Z \
            --output /tmp/goreecloud.conformance-result.json

      - name: Validate example conformance result schema and provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('schemas/goreecloud.conformance-result.schema.json').read_text())
          result = json.loads(Path('/tmp/goreecloud.conformance-result.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(result)
          expected_revision = os.environ['CANDIDATE_REVISION']
          if result['evaluated_revision'] != expected_revision:
              raise SystemExit('self-test evaluated revision must match the exact central candidate')
          if result['evaluator_revision'] != expected_revision:
              raise SystemExit('self-test evaluator revision must match the exact central candidate')
          print('platform-conformance-result: example provenance and schema validated')
          PY

      - name: Validate privacy-bounded public repository registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_public_repository_registry.py --verify-live-public

      - name: Prepare portfolio audit evidence
        shell: bash
        run: mkdir -p portfolio-audit-evidence

      - name: Audit public repository baseline adoption
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_public_repository_baselines.py \
            --json-output portfolio-audit-evidence/public-repository-baseline-audit.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

      - name: Audit public Platform manifest metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_public_platform_manifests.py \
            --json-output portfolio-audit-evidence/public-platform-manifest-audit.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

      - name: Audit all seven Integral Platform System declarations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_public_integral_platform_systems.py \
            --json-output portfolio-audit-evidence/public-integral-platform-system-audit.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

      - name: Audit authoritative Suite product coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_suite_product_coverage.py \
            --json-output portfolio-audit-evidence/suite-product-coverage-audit.json \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

      - name: Record portfolio audit provenance
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          provenance = {
              "schema": "goreecloud-portfolio-audit-provenance/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "candidate_revision": os.environ["CANDIDATE_REVISION"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
              "event_name": os.environ["EVENT_NAME"],
              "authority": {
                  "source_validation_only": True,
                  "lifecycle_verdict": False,
                  "platform_conformance_verdict": False,
                  "runtime_acceptance_verdict": False,
                  "production_readiness_verdict": False,
              },
          }
          Path("portfolio-audit-evidence/provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload portfolio audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-portfolio-audit-${{ env.CANDIDATE_REVISION }}
          path: portfolio-audit-evidence/
          if-no-files-found: error
          retention-days: 30

  reusable-provenance:
    name: Exercise reusable exact-revision provenance
    uses: ./.github/workflows/reusable-platform-manifest.yml
    with:
      manifest-path: examples/goreecloud.platform.example.yaml
