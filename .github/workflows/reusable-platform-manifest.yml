name: Reusable platform manifest validation

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Repository-relative path to the GoreeCloud platform manifest.
        required: false
        type: string
        default: goreecloud.platform.yaml

permissions:
  contents: read

jobs:
  validate-platform-manifest:
    name: Validate GoreeCloud Platform Contract and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANIFEST_PATH: ${{ inputs.manifest-path }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout exact Platform Contract implementation
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .goreecloud-platform-contract
          persist-credentials: false

      - name: Validate manifest path
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MANIFEST_PATH" || "$MANIFEST_PATH" = /* || "$MANIFEST_PATH" == *".."* ]]; then
            echo "Invalid repository-relative manifest path: $MANIFEST_PATH" >&2
            exit 1
          fi
          test -f "$MANIFEST_PATH"

      - name: Install contract validator dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.25.1

      - name: Validate GoreeCloud Platform Contract manifest
        run: python3 .goreecloud-platform-contract/scripts/validate_platform_manifest.py "$MANIFEST_PATH"

      - name: Compute platform conformance result
        run: |
          python3 .goreecloud-platform-contract/scripts/evaluate_platform_conformance.py \
            "$MANIFEST_PATH" \
            --revision "$GITHUB_SHA" \
            --evaluator-revision "${{ job.workflow_sha }}" \
            --output goreecloud.conformance-result.json

      - name: Validate computed conformance result schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('.goreecloud-platform-contract/schemas/goreecloud.conformance-result.schema.json').read_text())
          result = json.loads(Path('goreecloud.conformance-result.json').read_text())
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(result)
          print('platform-conformance-result: schema validated')
          PY

      - name: Upload platform conformance evidence
        if: always() && hashFiles('goreecloud.conformance-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-platform-conformance-${{ github.sha }}
          path: goreecloud.conformance-result.json
          if-no-files-found: error
          retention-days: 30
