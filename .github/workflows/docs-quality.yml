name: Documentation quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - 'tests/test_check_docs.py'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/check_docs.py'
      - 'tests/test_check_docs.py'
      - '.github/workflows/docs-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified actions/checkout v4 commit
      - name: Validate local links
        run: python3 tools/check_docs.py
      - name: Run checker unit tests
        run: python3 -m unittest discover -s tests -v
